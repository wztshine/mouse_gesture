# 鼠标手势配置
#
# 手势串由 1~3 段方向组成，用逗号分隔。方向取值（8 方向，顺时针）：
#   R  右        DR  右下      D  下        DL  左下
#   L  左        UL  左上      U  上        UR  右上
#
# 按应用分组：`[app."名称"]`，名称用 `--identify` 模式查看。
# 未匹配到应用时回退到 [default]。

[default]
"L" = ["alt", "left"]
"R" = ["alt", "right"]
"U" = ["home"]
"D" = ["end"]
"DR" = ["ctrl", "w"]
"UL" = ["ctrl", "shift", "t"]

[app."Gnome-terminal"]
"DR" = ["ctrl", "shift", "w"]
