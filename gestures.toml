# 鼠标手势配置
#
# 手势串由 1~3 段方向组成，用逗号分隔。方向取值（8 方向，顺时针）：
#   R  右        DR  右下      D  下        DL  左下
#   L  左        UL  左上      U  上        UR  右上
#
# 按应用分组：`[app.<名称>]`，名称用 `--identify` 模式查看。
# 未匹配到应用时回退到 [default]。

[default]
# 右滑 → 打开终端
"DR" = ["ctrl", "w"]
# 左滑 → 返回上一页
"L" = ["alt", "left"]
# 右滑 前进
"R" = ["alt", "right"]
# 上滑 → 关闭标签页
"U" = ["ctrl", "w"]
# 右再上 → 新建标签页
"R,U" = ["ctrl", "t"]

[app."firefox_firefox"]
# firefox：左滑 → 返回，右滑 → 前进
"L" = ["alt", "left"]
"R" = ["alt", "right"]
# 左上 → 打开最近关闭的标签
"UL" = ["ctrl", "shift", "t"]
# 右下 → 关闭当前标签
"DR" = ["ctrl", "w"]
# 上滑 → 滚动到顶部
"U" = ["home"]
# 下滑 → 滚动到底部
"D" = ["end"]

[app."Google-chrome"]
# chrome：左滑 → 返回，右滑 → 前进
"L" = ["alt", "left"]
"R" = ["alt", "right"]
# 左上 → 打开最近关闭的标签
"UL" = ["ctrl", "shift", "t"]
# 右下 → 关闭当前标签
"DR" = ["ctrl", "w"]
# 上滑 → 滚动到顶部
"U" = ["home"]
# 下滑 → 滚动到底部
"D" = ["end"]
